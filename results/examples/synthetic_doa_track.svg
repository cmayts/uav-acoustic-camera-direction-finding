<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic DOA Track — Illustrative Only</title>
  <desc id="desc">An illustrative direction-of-arrival curve that is not based on measured UAV data.</desc>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#111827">Synthetic DOA Track — Illustrative Only</text>
  <line x1="75" y1="390" x2="860" y2="390" stroke="#111827" stroke-width="2"/>
  <line x1="75" y1="65" x2="75" y2="390" stroke="#111827" stroke-width="2"/>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="75" y1="120" x2="860" y2="120"/><line x1="75" y1="200" x2="860" y2="200"/>
    <line x1="75" y1="280" x2="860" y2="280"/><line x1="75" y1="360" x2="860" y2="360"/>
  </g>
  <path d="M75 270 C130 245 165 165 220 185 S310 300 365 265 S450 125 520 155 S620 315 685 270 S785 150 860 190" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="470" y="430" text-anchor="middle" font-family="sans-serif" font-size="16">Time (s)</text>
  <text x="22" y="230" text-anchor="middle" transform="rotate(-90 22 230)" font-family="sans-serif" font-size="16">Estimated angle (deg)</text>
  <text x="860" y="418" text-anchor="end" font-family="sans-serif" font-size="12" fill="#6b7280">Not experimental data</text>
</svg>
